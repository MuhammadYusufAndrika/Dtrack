<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Offline — FleetVision AI</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #edf1f7; color: #334155; font-family: system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .card { max-width: 420px; text-align: center; background: rgba(255,255,255,0.9); border: 1px solid rgba(15,23,42,0.1);
    border-radius: 20px; padding: 36px 28px; box-shadow: 0 16px 48px rgba(15,23,42,0.12); }
  .dot { width: 64px; height: 64px; border-radius: 18px; background: linear-gradient(135deg,#2563eb,#06b6d4);
    display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 16px; }
  h1 { font-size: 20px; margin-bottom: 8px; color: #0f1420; }
  p { color: #64748b; font-size: 14px; line-height: 1.6; margin-bottom: 20px; }
  button { background: linear-gradient(135deg,#2563eb,#4f46e5,#06b6d4); color: #fff; border: 0; border-radius: 12px;
    padding: 12px 24px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%; }
  button:active { transform: scale(.98); }
  a { display: inline-block; margin-top: 14px; color: #2563eb; font-size: 13px; text-decoration: none; }
</style>
</head>
<body>
  <div class="card">
    <div class="dot">🚛</div>
    <h1>Kamu sedang offline</h1>
    <p>GPS tracking butuh koneksi internet.<br>Periksa koneksi lalu coba lagi — halaman <b>/track</b> akan dimuat otomatis saat online.</p>
    <button onclick="location.reload()">Coba Lagi</button>
    <a href="/track?utm_source=twa_offline">← Kembali ke Tracking</a>
  </div>
  <script>
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
